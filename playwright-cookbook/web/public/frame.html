<!doctype html><html lang="vi"><meta charset="utf-8"><title>Lab iframe</title><style>body{font:16px Segoe UI,sans-serif;color:#17233b;padding:16px}input,button{font:inherit;padding:8px;border:1px solid #aabbd1;border-radius:5px}button{background:#2456cf;color:white}output{display:block;margin-top:15px}</style><label>Tên trong iframe <input id="frame-name"></label> <button id="frame-save">Lưu trong iframe</button><output id="frame-result">Chưa lưu</output><script>document.querySelector('#frame-save').onclick=()=>document.querySelector('#frame-result').textContent='Xin chào '+document.querySelector('#frame-name').value;</script></html>
